name: Build NeXtep (scroll-column-v3)

on:
  workflow_dispatch:
  push:
    branches: [scroll-column-v3]
    paths:
      - '.github/workflows/android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: scroll-column-v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform 36.1 and build-tools 36
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: nextep-scroll-column-v3-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
